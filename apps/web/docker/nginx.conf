# Serves the built Fluid Frets app (dist/) on port 8080.
# The Dockerfile installs this as /etc/nginx/conf.d/default.conf.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text formats (the app's JS and CSS shrink by about 70 %).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml;

    include /etc/nginx/fluid-frets/security-headers.conf;

    # Built files have content-hashed names, so they can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/fluid-frets/security-headers.conf;
        try_files $uri =404;
    }

    # The page, the service worker and the manifest must always be revalidated so a new release is
    # picked up straight away.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/fluid-frets/security-headers.conf;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/fluid-frets/security-headers.conf;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        include /etc/nginx/fluid-frets/security-headers.conf;
    }

    # Single-page app: anything that isn't a file falls back to the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # For Docker / Synology health checks.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
