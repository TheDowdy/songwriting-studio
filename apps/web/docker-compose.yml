# Run:  docker compose up -d --build     then open http://localhost:8080
# On a Synology NAS: Container Manager → Project → Create, and point it at this folder.
services:
  fluid-frets:
    build: .
    image: fluid-frets:latest
    container_name: fluid-frets
    ports:
      - "8080:8080"
    restart: unless-stopped
