# Security headers for every response. nginx does not inherit `add_header` into a location that sets
# its own, so nginx.conf includes this file in each such location as well as at server level.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# The app loads nothing from other sites, so the policy is strict. Inline styles are allowed because
# React sets some style attributes; there are no inline scripts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
